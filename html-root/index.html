<!DOCTYPE html>
<html>
	<head>
		<script src="wsr.js" wasm-url="item-list.wasm"></script>
		<link rel="stylesheet" href="index.css" />
	</head>
	<body wsr-get="/preprocessed.json" wsr-call="initPage" >
		<div class="unselected-items-pane items-pane">
			<h2>Untracked</h2>
			<div id="untracked-items" class="items">
			</div>
		</div>

		<div class="right-pane">
			<div class="selected-items-pane items-pane">
				<h2>Tracked</h2>
				<div id="tracked-items" class="items">
				</div>
			</div>

			<div class="component-items-pane items-pane">
				<h2>Components</h2>
				<div id="item-components" class="items">
				</div>
			</div>
		</div>
	</body>
</html>
